[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisguard"
version = "1.0.0"
description = "AegisGuard - endpoint security and system health suite for Windows"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
build = ["pyinstaller>=6.6", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
aegisguard = "aegisguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
