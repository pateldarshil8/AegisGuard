name: Build and release

# Every push to main that changes code builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of AegisGuard notice the new release and offer to update.
# Version = <major>.<minor> from src/aegisguard/__init__.py + a patch number that counts up automatically
# (first build = x.y.0, then x.y.1, ...). To start a new line (e.g. 1.1.x), change the version in __init__.py.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content src/aegisguard/__init__.py -Raw), '__version__ = "(\d+)\.(\d+)\.\d+"')
          if (-not $m.Success) { throw "Could not read __version__" }
          $patch = [int]"${{ github.run_number }}" - 1
          $v = "$($m.Groups[1].Value).$($m.Groups[2].Value).$patch"
          (Get-Content src/aegisguard/__init__.py -Raw) -replace '__version__ = "[^"]*"', "__version__ = `"$v`"" | Set-Content src/aegisguard/__init__.py -NoNewline
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install -e ".[ui,dev]"
          python -m pytest -o addopts="" --basetemp="$env:RUNNER_TEMP\pytest"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.AEGISGUARD_SIGN_PFX_BASE64 }}
          AEGISGUARD_SIGN_PASSWORD: ${{ secrets.AEGISGUARD_SIGN_PASSWORD }}
        run: |
          # Sign the app and installer when a signing certificate is configured (skipped otherwise)
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $env:AEGISGUARD_SIGN_PFX = $pfx
          }
          ./installer/build.ps1

      - name: Write checksum
        shell: pwsh
        run: |
          $f = Get-ChildItem dist-installer/AegisGuardSetup-*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: AegisGuard ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist-installer/AegisGuardSetup-*.exe
            dist-installer/AegisGuardSetup-*.exe.sha256
